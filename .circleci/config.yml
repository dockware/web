version: 2.1

parameters:
  imageName:
    type: string
    default: ""
  imageTag:
    type: string
    default: ""
  setLatest:
    description: defines if the latest tag should be set to this version
    type: boolean
    default: false

# -----------------------------------------------------------------------------------------------------
# -----------------------------------------------------------------------------------------------------
# -----------------------------------------------------------------------------------------------------
# -----------------------------------------------------------------------------------------------------

workflows:

  release-image:
    when:
      and:
        - not:
            # avoid that it automatically triggers on push
            equal: [ "", << pipeline.parameters.imageName >> ]
    jobs:
      # no build at all while packages.sury.org has not published the same PHP packages for amd64 and arm64
      - job-preflight:
          name: preflight
      # ------------------------------------------------------------------------------------
      - job-build-arm64:
          name: dockware/<< pipeline.parameters.imageName >>:<< pipeline.parameters.imageTag >>-arm-64
          imageName: << pipeline.parameters.imageName >>
          imageTag: << pipeline.parameters.imageTag >>
          requires:
            - preflight
      # ------------------------------------------------------------------------------------
      - job-build-amd64:
          name: dockware/<< pipeline.parameters.imageName >>:<< pipeline.parameters.imageTag >>-amd-64
          imageName: << pipeline.parameters.imageName >>
          imageTag: << pipeline.parameters.imageTag >>
          requires:
            - preflight
      # ------------------------------------------------------------------------------------
      - job-update-manifest:
          name: update-manifest
          imageName: << pipeline.parameters.imageName >>
          imageTag: << pipeline.parameters.imageTag >>
          setLatest: << pipeline.parameters.setLatest >>
          requires:
            - dockware/<< pipeline.parameters.imageName >>:<< pipeline.parameters.imageTag >>-arm-64
            - dockware/<< pipeline.parameters.imageName >>:<< pipeline.parameters.imageTag >>-amd-64

# -----------------------------------------------------------------------------------------------------
# -----------------------------------------------------------------------------------------------------
# -----------------------------------------------------------------------------------------------------
# -----------------------------------------------------------------------------------------------------

executors:
  ubuntu-executor:
    machine:
      image: ubuntu-2204:current
      docker_layer_caching: true


# Define a job to be invoked later in a workflow.
# See: https://circleci.com/docs/2.0/configuration-reference/#jobs
jobs:

  job-preflight:
      executor: ubuntu-executor
      resource_class: medium
      steps:
          - checkout
          - run:
              name: Check packages.sury.org (amd64 + arm64 in sync)
              command: |
                make preflight

  job-build-arm64:
      executor: ubuntu-executor
      resource_class: arm.medium
      parameters:
        imageName:
          type: string
        imageTag:
          type: string
      steps:
          - checkout
          - cmd_install
          - cmd_image_build_push:
              imageName: <<parameters.imageName>>
              imageTag: <<parameters.imageTag>>
              imageArch: "arm64"

  job-build-amd64:
      executor: ubuntu-executor
      resource_class: medium
      parameters:
          imageName:
            type: string
          imageTag:
            type: string
      steps:
          - checkout
          - cmd_install
          - cmd_image_build_push:
              imageName: << parameters.imageName >>
              imageTag: << parameters.imageTag >>
              imageArch: "amd64"

  job-update-manifest:
      executor: ubuntu-executor
      resource_class: medium
      parameters:
          imageName:
            type: string
          imageTag:
            type: string
          setLatest:
            type: boolean
      steps:
          # ------------------------------------------------------------------------------------
          - run:
              name: Docker Hub Login
              command: |
                echo "$DOCKERHUB_PASS" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          # ------------------------------------------------------------------------------------
          - run:
              name: Create and push manifest (<< parameters.imageTag >>)
              command: |
                docker buildx imagetools create -t dockware/<< parameters.imageName >>:<< parameters.imageTag >> dockware/<< parameters.imageName >>:<< parameters.imageTag >>-amd64 dockware/<< parameters.imageName >>:<< parameters.imageTag >>-arm64
          # ------------------------------------------------------------------------------------
          - run:
              name: Create and push manifest (latest)
              command: |
                if [ << parameters.setLatest >> = true ]; then
                  docker buildx imagetools create -t dockware/<< parameters.imageName >>:latest dockware/<< parameters.imageName >>:<< parameters.imageTag >>-amd64 dockware/<< parameters.imageName >>:<< parameters.imageTag >>-arm64
                fi

# -----------------------------------------------------------------------------------------------------
# -----------------------------------------------------------------------------------------------------
# -----------------------------------------------------------------------------------------------------
# -----------------------------------------------------------------------------------------------------

# these are shared commands for arm64 and amd64 jobs
commands:

  cmd_install:
    steps:
      - restore_cache:
          name: Restore Cache
          key: vendor-cache
          paths:
            - vendor
      - run:
          name: Prepare Build Environment
          command: |
            # same PHP source as the image, the ondrej/php ppa on launchpad is not needed
            curl -fsSL -o /tmp/debsuryorg-archive-keyring.deb https://packages.sury.org/debsuryorg-archive-keyring.deb
            sudo dpkg -i /tmp/debsuryorg-archive-keyring.deb
            echo "deb [signed-by=/usr/share/keyrings/debsuryorg-archive-keyring.gpg] https://packages.sury.org/php/ $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/php.list
            sudo apt-get update
            sudo apt-get install -y php8.4-cli php8.4-xml unzip
            php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
            php composer-setup.php
            sudo mv composer.phar /usr/local/bin/composer
      # ------------------------------------------------------------------------------------
      - run:
          name: Install Build Dependencies
          command: |
            make install
      - save_cache:
          name: Save Cache
          key: vendor-cache
          paths:
            - vendor

  cmd_image_build_push:
    parameters:
      imageName:
        type: string
      imageTag:
        type: string
      imageArch:
        type: string
    steps:
      # ------------------------------------------------------------------------------------
      # only versions approved with "make release" are built (.release), dev-main is the nightly build
      - run:
          name: Check Release Approval
          command: |
            if [ "<< parameters.imageTag >>" != "dev-main" ] && [ "$(cat .release 2>/dev/null)" != "<< parameters.imageTag >>" ]; then
              echo "Version << parameters.imageTag >> is not approved. Approved: $(cat .release 2>/dev/null || echo none). Run 'make release version=<< parameters.imageTag >>' first."
              exit 1
            fi
      # ------------------------------------------------------------------------------------
      - run:
          name: Build Image web:<< parameters.imageTag >>
          command: |
            make build version=<< parameters.imageTag >> -B
      # ------------------------------------------------------------------------------------
      - run:
          name: Run SVRUnit Tests
          command: |
            make svrunit version=<< parameters.imageTag >> -B
      - store_test_results:
          path: .reports
      - store_artifacts:
          path: .reports/report.xml
          destination: svrunit.xml
        # ------------------------------------------------------------------------------------
      - run:
          name: Run Cypress Tests
          command: |
            make cypress version=<< parameters.imageTag >>
      # ------------------------------------------------------------------------------------
      - run:
          name: Docker Hub Login
          command: |
            echo "$DOCKERHUB_PASS" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - run:
          name: Tag Image for ARCH
          command: |
            docker tag dockware/<< parameters.imageName >>:<< parameters.imageTag >> dockware/<< parameters.imageName >>:<< parameters.imageTag >>-<< parameters.imageArch >>
      - run:
          name: Push Image
          command: |
            docker push dockware/<< parameters.imageName >>:<< parameters.imageTag >>-<< parameters.imageArch >>