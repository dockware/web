commands:
  - name: "NODE Version 26"
    command: "node -v"
    expected: "v26."
  - name: "NODE Version 26 as SUDO user"
    command: "sudo node -v"
    not_expected: "command not found" # sudo version switch does not always work, but it needs to be at least found!!!
  - name: "NODE version is >= 26.13.1 (security release 2026-11-11)"
    command: "node -e \"const [a,b,c]=process.versions.node.split('.').map(Number);console.log(a*1e6+b*1e3+c >= 26013001 ? 'PATCHED' : 'VULNERABLE')\""
    expected: "PATCHED"
