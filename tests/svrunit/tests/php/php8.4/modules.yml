commands:
  - name: "PHP version is 8.4"
    command: "php -v"
    expected: "8.4"
  - name: "PHP version is not RC"
    command: "php -v"
    not_expected: "RC"
  - name: "php8.4-cli package is >= 8.4.27-1 (CVE-2026-109618, CVE-2026-109619)"
    command: "dpkg --compare-versions $(dpkg-query -W php8.4-cli | cut -f2) ge 8.4.27-1 && echo PATCHED || echo VULNERABLE"
    expected: "PATCHED"

php_module:
  - name: "PHP Module: intl"
    module: "intl"
