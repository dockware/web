commands:
  - name: "PHP version is 8.5"
    command: "php -v"
    expected: "8.5"
  - name: "PHP version is not RC"
    command: "php -v"
    not_expected: "RC"
  - name: "php8.5-cli package is >= 8.5.12-1 (CVE-2026-109618, CVE-2026-109619)"
    command: "dpkg --compare-versions $(dpkg-query -W php8.5-cli | cut -f2) ge 8.5.12-1 && echo PATCHED || echo VULNERABLE"
    expected: "PATCHED"

php_module:
  - name: "PHP Module: intl"
    module: "intl"
  - name: "PHP Module: SOAP"
    module: "soap"
  - name: "PHP Module: mbstring"
    module: "mbstring"
  - name: "PHP Module: zip"
    module: "zip"
  - name: "PHP Module: mysql"
    module: "mysql"
  - name: "PHP Module: bcmath"
    module: "bcmath"
  - name: "PHP Module: APCU"
    module: "apcu"
  - name: "PHP Module: Redis"
    module: "redis"
  - name: "PHP Module: AMQP"
    module: "amqp"
  - name: "PHP Module: zstd"
    module: "zstd"
  - name: "PHP Module: PCov"
