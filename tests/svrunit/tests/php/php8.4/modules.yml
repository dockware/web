commands:
  - name: "PHP version is 8.4"
    command: "php -v"
    expected: "8.4"
  - name: "PHP version is not RC"
    command: "php -v"
    not_expected: "RC"
  - name: "php8.4-cli package is >= 8.4.28-1 (security release 2026-11-19)"
    command: "v=$(dpkg-query -W -f='${Version}' php8.4-cli); dpkg --compare-versions $v ge 8.4.28-1 && echo $v '>=' 8.4.28-1 || echo $v '<' 8.4.28-1"
    expected: ">= 8.4.28-1"

php_module:
  - name: "PHP Module: intl"
    module: "intl"
  - name: "PHP Module: SOAP"
    module: "soap"
  - name: "PHP Module: mbstring"
    module: "mbstring"
  - name: "PHP Module: zip"
    module: "zip"
  - name: "PHP Module: mysql"
    module: "mysql"
  - name: "PHP Module: bcmath"
    module: "bcmath"
  - name: "PHP Module: imap"
    module: "imap"
  - name: "PHP Module: REDIS"
